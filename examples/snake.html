<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agent 生成物：贪吃蛇</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #08111f; color: #e5eefb; }
    main { width: min(92vw, 620px); padding: 24px; border: 1px solid #26354d; border-radius: 20px; background: #101c2e; box-shadow: 0 24px 70px #0008; }
    header, .controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: clamp(22px, 5vw, 34px); }
    .stats { display: flex; gap: 16px; color: #9eb4d1; }
    strong { color: #f8fafc; font-variant-numeric: tabular-nums; }
    canvas { display: block; width: 100%; aspect-ratio: 1; margin: 20px 0; border: 1px solid #304360; border-radius: 12px; background: #07101c; touch-action: none; }
    button { border: 0; border-radius: 10px; padding: 10px 16px; background: #5ee6a8; color: #062719; font-weight: 800; cursor: pointer; }
    #status { color: #9eb4d1; }
    .help { margin: 12px 0 0; color: #7187a5; font-size: 14px; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>贪吃蛇</h1>
    <div class="stats"><span>分数 <strong id="score">0</strong></span><span>最高 <strong id="best">0</strong></span></div>
  </header>
  <canvas id="board" width="560" height="560" aria-label="贪吃蛇游戏棋盘"></canvas>
  <div class="controls">
    <button id="toggle" type="button">开始</button>
    <span id="status">等待开始</span>
  </div>
  <p class="help">方向键 / WASD 移动，空格开始或暂停。游戏结束后按空格重新开始。</p>
</main>
<script>
(() => {
  const canvas = document.querySelector('#board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.querySelector('#score');
  const bestEl = document.querySelector('#best');
  const statusEl = document.querySelector('#status');
  const toggle = document.querySelector('#toggle');
  const cells = 20;
  const stepMs = 115;
  const vectors = {
    ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1],
    ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0]
  };
  let snake, food, direction, nextDirection, score, best, state, lastStep = 0;

  function reset() {
    snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
    direction = nextDirection = [1, 0];
    score = 0;
    state = 'ready';
    best = Number(localStorage.getItem('snake-best') || 0);
    placeFood();
    syncUi();
  }

  function placeFood() {
    do {
      food = {x: Math.floor(Math.random() * cells), y: Math.floor(Math.random() * cells)};
    } while (snake.some(part => part.x === food.x && part.y === food.y));
  }

  function update() {
    direction = nextDirection;
    const head = {x: snake[0].x + direction[0], y: snake[0].y + direction[1]};
    const hitWall = head.x < 0 || head.y < 0 || head.x >= cells || head.y >= cells;
    const ate = head.x === food.x && head.y === food.y;
    const collisionBody = ate ? snake : snake.slice(0, -1);
    const hitSelf = collisionBody.some(part => part.x === head.x && part.y === head.y);
    if (hitWall || hitSelf) return gameOver();
    snake.unshift(head);
    if (ate) {
      score += 10;
      if (score > best) {
        best = score;
        localStorage.setItem('snake-best', String(best));
      }
      placeFood();
    } else {
      snake.pop();
    }
    syncUi();
  }

  function gameOver() {
    state = 'over';
    syncUi();
  }

  function syncUi() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
    statusEl.textContent = {ready: '等待开始', running: '游戏中', paused: '已暂停', over: '游戏结束'}[state];
    toggle.textContent = state === 'running' ? '暂停' : state === 'over' ? '重新开始' : '开始';
  }

  function toggleGame() {
    if (state === 'over') reset();
    state = state === 'running' ? 'paused' : 'running';
    lastStep = performance.now();
    syncUi();
  }

  function draw() {
    const size = canvas.width;
    const cell = size / cells;
    ctx.clearRect(0, 0, size, size);
    ctx.strokeStyle = '#102038';
    ctx.lineWidth = 1;
    for (let i = 1; i < cells; i++) {
      ctx.beginPath(); ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, size); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * cell); ctx.lineTo(size, i * cell); ctx.stroke();
    }
    ctx.fillStyle = '#ff637d';
    ctx.beginPath(); ctx.arc((food.x + .5) * cell, (food.y + .5) * cell, cell * .34, 0, Math.PI * 2); ctx.fill();
    snake.forEach((part, index) => {
      ctx.fillStyle = index === 0 ? '#83f5bd' : '#38c98a';
      ctx.fillRect(part.x * cell + 2, part.y * cell + 2, cell - 4, cell - 4);
    });
  }

  function frame(now) {
    if (state === 'running' && now - lastStep >= stepMs) {
      update();
      lastStep = now;
    }
    draw();
    requestAnimationFrame(frame);
  }

  addEventListener('keydown', event => {
    if (event.code === 'Space') {
      event.preventDefault();
      toggleGame();
      return;
    }
    const candidate = vectors[event.code];
    if (!candidate) return;
    event.preventDefault();
    if (candidate[0] !== -direction[0] || candidate[1] !== -direction[1]) nextDirection = candidate;
  });
  toggle.addEventListener('click', toggleGame);
  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
